name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  camp-bench-submission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/camp_bench.py benchmark/submission.example.json

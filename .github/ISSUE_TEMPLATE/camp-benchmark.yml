name: CAMP Benchmark Submission
description: Opt in to the anonymous CAMP benchmark dataset. Do not include confidential company information.
title: "[CAMP Benchmark] "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contributing to CAMP Benchmark.
        Do **not** enter a company name, personal name, email, confidential project name, customer information, or internal system details.
        Note: your GitHub account will be visible because this is a public Issue.

  - type: checkboxes
    id: consent
    attributes:
      label: Consent
      options:
        - label: I voluntarily agree to share the following CAMP assessment data for aggregate benchmarking.
          required: true
        - label: I understand that my GitHub account is publicly visible on this Issue.
          required: true

  - type: dropdown
    id: country
    attributes:
      label: Country
      options:
        - South Korea
        - United States
        - Japan
        - China
        - Singapore
        - India
        - United Kingdom
        - Germany
        - France
        - Other
    validations:
      required: true

  - type: dropdown
    id: industry
    attributes:
      label: Industry
      options:
        - Manufacturing
        - Financial Services / Insurance
        - IT / SaaS
        - Retail / Commerce
        - Professional Services
        - Healthcare / Bio
        - Public / Education
        - Media / Content
        - Construction / Energy
        - Other
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Assessment Scope
      options:
        - Entire company
        - Business unit / division
        - Team / department
        - New AI-native organization / startup
    validations:
      required: true

  - type: dropdown
    id: headcount
    attributes:
      label: Assessed Headcount
      options:
        - 1-10
        - 11-50
        - 51-200
        - 201-1000
        - 1001-5000
        - 5000+
    validations:
      required: true

  - type: dropdown
    id: function
    attributes:
      label: Primary Function
      options:
        - Company-wide / Multiple functions
        - Strategy / Management
        - R&D / Engineering
        - Software / IT
        - Data / AI / DX
        - Sales / Marketing
        - SCM / Procurement / Manufacturing
        - Finance / HR / Legal
        - Customer Service
        - Other
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: CAMP Stage
      options:
        - Stage 0 - No AI
        - Stage 1 - AI Access
        - Stage 2 - AI Workforce
        - Stage 3 - Connected AI
        - Stage 4 - Compounding AI
        - Stage 5 - AI-Native Company
    validations:
      required: true

  - type: input
    id: total_score
    attributes:
      label: CAMP Score (0-100)
      placeholder: "e.g. 65"
    validations:
      required: true

  - type: input
    id: access
    attributes:
      label: AI Access score (0-20)
      placeholder: "e.g. 10"
    validations:
      required: true

  - type: input
    id: delegation
    attributes:
      label: AI Delegation score (0-20)
      placeholder: "e.g. 15"
    validations:
      required: true

  - type: input
    id: connection
    attributes:
      label: Enterprise Connection score (0-20)
      placeholder: "e.g. 15"
    validations:
      required: true

  - type: input
    id: compounding
    attributes:
      label: Knowledge Compounding score (0-20)
      placeholder: "e.g. 5"
    validations:
      required: true

  - type: input
    id: transformation
    attributes:
      label: Role Transformation score (0-20)
      placeholder: "e.g. 5"
    validations:
      required: true

  - type: dropdown
    id: operations
    attributes:
      label: AI Operations
      options:
        - Weak
        - Developing
        - Strong
    validations:
      required: true

  - type: dropdown
    id: sovereignty
    attributes:
      label: Sovereign AI capability
      options:
        - API
        - Portfolio
        - Private
        - Post-trained
        - Foundation
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: Final confirmation
      options:
        - label: I confirm that I did not include confidential or personally identifiable information.
          required: true
